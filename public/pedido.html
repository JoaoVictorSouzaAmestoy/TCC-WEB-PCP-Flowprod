<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowProd — Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:#080d14; color:#e8edf5; font-family:'Poppins',sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
  }

  /* ── Topbar ── */
  .topbar {
    background:#0d1520; border-bottom:1px solid #1a2740;
    padding:0 32px; height:56px; display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .logo { font-size:17px; font-weight:700; color:#2b7fff; letter-spacing:1px; }
  .divider-v { width:1px; height:22px; background:#1a2740; }
  .page-title { font-size:13px; color:#6b82a0; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .user-chip { display:flex; align-items:center; gap:8px; background:#080d14; border:1px solid #1a2740; border-radius:8px; padding:5px 12px; }
  .user-av { width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,#0e7490,#06b6d4); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .user-nm { font-size:13px; color:#a0b0c8; }
  .btn-logout { background:none; border:1px solid #1a2740; color:#6b82a0; padding:5px 14px; border-radius:6px; font-size:12px; cursor:pointer; font-family:'Poppins',sans-serif; transition:.2s; }
  .btn-logout:hover { border-color:#f43f5e; color:#f43f5e; }

  /* ── Área principal ── */
  .main { flex:1; padding:28px 16px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:900px; }

  /* ── Abas ── */
  .tabs { display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid #1a2740; }
  .tab-btn {
    background:none; border:none; color:#6b82a0; font-family:'Poppins',sans-serif;
    font-size:13px; font-weight:600; padding:10px 18px; cursor:pointer;
    border-bottom:2px solid transparent; transition:.2s;
  }
  .tab-btn.active { color:#2b7fff; border-bottom-color:#2b7fff; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* ── Card do formulário ── */
  .card { background:#0d1520; border:1px solid #1a2740; border-radius:16px; padding:32px 36px; }
  .card-header {
    display:flex; align-items:center; gap:16px; margin-bottom:24px;
    padding-bottom:18px; border-bottom:1px solid #1a2740;
  }
  .card-icon { font-size:34px; }
  .card-title { font-size:20px; font-weight:700; }
  .card-sub   { font-size:13px; color:#4a6080; margin-top:3px; }

  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px 20px; margin-bottom:20px; }
  .form-group { display:flex; flex-direction:column; gap:6px; }
  label { font-size:11px; font-weight:600; color:#6b82a0; text-transform:uppercase; letter-spacing:.7px; }
  input, textarea, select {
    background:#080d14; border:1px solid #1a2740; border-radius:8px;
    color:#e8edf5; font-family:'Poppins',sans-serif; font-size:14px;
    padding:10px 14px; transition:.2s; outline:none; width:100%;
  }
  input:focus, textarea:focus, select:focus { border-color:#2b7fff; }
  textarea { resize:vertical; min-height:70px; }

  /* ── Itens do pedido ── */
  .itens-titulo { font-size:12px; font-weight:700; color:#a0b0c8; text-transform:uppercase; letter-spacing:.6px; margin-bottom:10px; }
  .item-row {
    display:grid; grid-template-columns:1fr 110px 90px 34px; gap:10px; margin-bottom:10px; align-items:center;
  }
  .btn-remover-item {
    background:none; border:1px solid #1a2740; color:#6b82a0; border-radius:8px;
    width:34px; height:38px; cursor:pointer; font-size:15px; transition:.2s;
  }
  .btn-remover-item:hover { border-color:#f43f5e; color:#f43f5e; }
  .btn-add-item {
    background:none; border:1px dashed #1a2740; color:#2b7fff; border-radius:8px;
    padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:'Poppins',sans-serif;
    width:100%; margin-top:2px; transition:.2s;
  }
  .btn-add-item:hover { border-color:#2b7fff; background:rgba(43,127,255,.06); }

  .form-footer { margin-top:22px; display:flex; align-items:center; gap:16px; padding-top:18px; border-top:1px solid #1a2740; }
  .aviso { flex:1; display:flex; align-items:center; gap:8px; background:#080d14; border:1px solid #1a2740; border-radius:8px; padding:10px 14px; }
  .aviso span { font-size:12px; color:#3a5070; line-height:1.5; }
  .btn-enviar {
    background:linear-gradient(135deg,#1a5ccc,#2b7fff); border:none; border-radius:8px;
    color:#fff; cursor:pointer; font-family:'Poppins',sans-serif;
    font-size:14px; font-weight:600; padding:12px 32px; transition:.2s; white-space:nowrap;
    display:flex; align-items:center; gap:8px;
  }
  .btn-enviar:hover { opacity:.9; transform:translateY(-1px); }
  .btn-enviar:disabled { opacity:.5; cursor:not-allowed; transform:none; }
  .spinner { width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .msg { border-radius:8px; font-size:13px; padding:10px 14px; display:none; margin-top:12px; }
  .msg.ok  { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.25); color:#22c55e; }
  .msg.err { background:rgba(244,63,94,.1);  border:1px solid rgba(244,63,94,.25); color:#f43f5e; }

  /* ── Histórico ── */
  .pedido-card { background:#0d1520; border:1px solid #1a2740; border-radius:12px; margin-bottom:14px; overflow:hidden; }
  .pedido-head {
    display:flex; align-items:center; justify-content:space-between; padding:14px 20px;
    cursor:pointer; gap:12px; flex-wrap:wrap;
  }
  .pedido-head:hover { background:#0f1a2a; }
  .pedido-num { font-size:14px; font-weight:700; }
  .pedido-data { font-size:12px; color:#4a6080; margin-top:2px; }
  .pedido-resumo { font-size:12px; color:#6b82a0; }
  .status-pill { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; padding:4px 12px; border-radius:20px; white-space:nowrap; }
  .st-PENDENTE            { background:rgba(245,158,11,.12); color:#f59e0b; border:1px solid rgba(245,158,11,.25); }
  .st-CONFIRMADO          { background:rgba(34,197,94,.12);  color:#22c55e; border:1px solid rgba(34,197,94,.25); }
  .st-CANCELADO           { background:rgba(244,63,94,.12);  color:#f43f5e; border:1px solid rgba(244,63,94,.25); }
  .pedido-detalhe { display:none; padding:0 20px 18px; border-top:1px solid #1a2740; }
  .pedido-detalhe.aberto { display:block; }
  .item-linha { display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid #0d1928; }
  .item-linha:last-child { border-bottom:none; }
  .item-nome { color:#e8edf5; }
  .item-qtd { color:#6b82a0; }
  .pedido-obs { font-size:12px; color:#4a6080; margin-top:10px; font-style:italic; }
  .vazio { text-align:center; color:#3a5070; font-size:13px; padding:40px 0; }

  /* ── Sino cliente ── */
  .sino-wrap { position:relative; }
  .sino-btn {
    background:none; border:1px solid #1a2740; border-radius:8px;
    color:#6b82a0; cursor:pointer; padding:6px 10px; font-size:16px;
    transition:.2s; position:relative; line-height:1;
  }
  .sino-btn:hover { border-color:#06b6d4; color:#06b6d4; }
  .sino-badge {
    position:absolute; top:-6px; right:-6px;
    background:#f43f5e; color:#fff; font-size:10px; font-weight:700;
    width:18px; height:18px; border-radius:50%;
    display:none; align-items:center; justify-content:center;
    border:2px solid #080d14;
  }
  .notif-painel {
    display:none; position:absolute; top:calc(100% + 8px); right:0;
    width:320px; background:#0d1520; border:1px solid #1a2740;
    border-radius:12px; z-index:200;
    box-shadow:0 12px 40px rgba(0,0,0,.5); overflow:hidden;
  }
  .notif-header { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid #1a2740; }
  .notif-header span { font-size:13px; font-weight:600; }
  .notif-marcar { background:none; border:none; color:#6b82a0; cursor:pointer; font-size:11px; font-family:'Poppins',sans-serif; transition:.2s; }
  .notif-marcar:hover { color:#06b6d4; }
  .notif-lista { max-height:300px; overflow-y:auto; }
  .notif-item { padding:12px 16px; border-bottom:1px solid #0d1928; display:flex; gap:10px; align-items:flex-start; transition:.15s; }
  .notif-item:hover { background:#080d14; }
  .notif-item.nao-lida { background:rgba(6,182,212,.05); }
  .notif-dot { width:7px; height:7px; border-radius:50%; background:#06b6d4; margin-top:5px; flex-shrink:0; }
  .notif-dot.lida { background:#1a2740; }
  .notif-titulo { font-size:13px; font-weight:600; margin-bottom:2px; }
  .notif-msg { font-size:12px; color:#6b82a0; line-height:1.5; }
  .notif-tempo { font-size:11px; color:#3a5070; margin-top:3px; }
  .notif-vazia { padding:28px; text-align:center; color:#3a5070; font-size:13px; }

  @media(max-width:640px) {
    .form-grid { grid-template-columns:1fr; }
    .item-row { grid-template-columns:1fr 80px 34px; }
    .item-row .item-unidade { display:none; }
    .card { padding:22px 18px; }
    .form-footer { flex-direction:column; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="logo">FlowProd</span>
    <div class="divider-v"></div>
    <span class="page-title">Área do Cliente</span>
  </div>
  <div class="topbar-right">
    <div class="sino-wrap">
      <button class="sino-btn" onclick="toggleNotif(event)" title="Notificações">
        🔔
        <span class="sino-badge" id="sinoBadge"></span>
      </button>
      <div class="notif-painel" id="notifPainel">
        <div class="notif-header">
          <span>Notificações</span>
          <button class="notif-marcar" onclick="marcarLidas()">Marcar lidas</button>
        </div>
        <div class="notif-lista" id="notifLista">
          <div class="notif-vazia">Sem notificações</div>
        </div>
      </div>
    </div>
    <div class="user-chip">
      <div class="user-av" id="avatar">?</div>
      <span class="user-nm" id="userName">Carregando...</span>
    </div>
    <button class="btn-logout" onclick="sair()">Sair</button>
  </div>
</div>

<div class="main">
  <div class="wrap">

    <div class="tabs">
      <button class="tab-btn active" id="tabBtnNovo" onclick="mudarAba('novo')">📝 Novo Pedido</button>
      <button class="tab-btn" id="tabBtnHistorico" onclick="mudarAba('historico')">📋 Meus Pedidos</button>
    </div>

    <!-- ── ABA: NOVO PEDIDO ── -->
    <div class="tab-panel active" id="panelNovo">
      <div class="card">
        <div class="card-header">
          <div class="card-icon">📝</div>
          <div>
            <div class="card-title">Novo Pedido</div>
            <div class="card-sub">Adicione um ou mais produtos. Sua solicitação será encaminhada ao Forecast.</div>
          </div>
        </div>

        <div class="itens-titulo">Itens do pedido</div>
        <div id="listaItens"></div>
        <button type="button" class="btn-add-item" onclick="adicionarItem()">+ Adicionar produto</button>

        <div class="form-grid" style="margin-top:20px;">
          <div class="form-group">
            <label>Data desejada de entrega</label>
            <input type="date" id="dataDesejada">
          </div>
          <div class="form-group span-2" style="grid-column: span 2;">
            <label>Observações do pedido</label>
            <textarea id="observacoes" placeholder="Detalhes gerais, urgências ou qualquer informação relevante..."></textarea>
          </div>
        </div>

        <div class="msg" id="msgPedido"></div>

        <div class="form-footer">
          <div class="aviso">
            <span>🔒</span>
            <span>Pedido vinculado à sua conta. A equipe de Forecast/PCP receberá a solicitação.</span>
          </div>
          <button class="btn-enviar" id="btnEnviar" onclick="enviarPedido()">
            <span id="btnText">Enviar Pedido</span>
            <div class="spinner" id="spinner"></div>
          </button>
        </div>
      </div>
    </div>

    <!-- ── ABA: HISTÓRICO ── -->
    <div class="tab-panel" id="panelHistorico">
      <div id="listaHistorico"><div class="vazio">Carregando pedidos...</div></div>
    </div>

  </div>
</div>

<script>
  let _itemSeq = 0;
  let _catalogo = [];

  fetch('/api/clientes/me', { credentials:'include' })
    .then(r => { if(!r.ok) throw new Error(); return r.json(); })
    .then(d => {
      document.getElementById('userName').textContent = d.cliente.nome;
      document.getElementById('avatar').textContent   = d.cliente.nome.charAt(0).toUpperCase();
    })
    .catch(() => window.location.href = '/');

  fetch('/api/produtos/catalogo', { credentials:'include' })
    .then(r => { if(!r.ok) throw new Error(); return r.json(); })
    .then(d => { _catalogo = d.produtos || []; adicionarItem(); })
    .catch(() => { _catalogo = []; adicionarItem(); });

  function mudarAba(aba) {
    document.getElementById('panelNovo').classList.toggle('active', aba === 'novo');
    document.getElementById('panelHistorico').classList.toggle('active', aba === 'historico');
    document.getElementById('tabBtnNovo').classList.toggle('active', aba === 'novo');
    document.getElementById('tabBtnHistorico').classList.toggle('active', aba === 'historico');
    if (aba === 'historico') carregarHistorico();
  }

  function adicionarItem() {
    const id = ++_itemSeq;
    const div = document.createElement('div');
    div.className = 'item-row';
    div.id = `item-${id}`;
    const opcoes = _catalogo.map(p =>
      `<option value="${p.id}" data-unidade="${p.unidade_padrao}">${p.nome}</option>`
    ).join('');
    div.innerHTML = `
      <select class="item-produto" onchange="preencherUnidade(this)">
        <option value="">Selecione um produto...</option>
        ${opcoes}
      </select>
      <input type="number" placeholder="Qtd" class="item-qtd-input" min="1">
      <input type="text" placeholder="Un." class="item-unidade" maxlength="20" readonly>
      <button type="button" class="btn-remover-item" onclick="removerItem(${id})" title="Remover">✕</button>
    `;
    document.getElementById('listaItens').appendChild(div);
  }

  function preencherUnidade(select) {
    const row = select.closest('.item-row');
    const opt = select.options[select.selectedIndex];
    row.querySelector('.item-unidade').value = opt?.dataset.unidade || '';
  }

  function removerItem(id) {
    const el = document.getElementById(`item-${id}`);
    if (el) el.remove();
    if (!document.querySelectorAll('.item-row').length) adicionarItem();
  }

  // Começa sempre com 1 item em branco
  adicionarItem();

  function coletarItens() {
    return Array.from(document.querySelectorAll('.item-row')).map(row => ({
      produto_id: row.querySelector('.item-produto').value,
      quantidade: row.querySelector('.item-qtd-input').value,
      unidade: row.querySelector('.item-unidade').value.trim() || null,
    })).filter(it => it.produto_id || it.quantidade);
  }

  async function enviarPedido() {
    const itens = coletarItens();
    const dataDesejada = document.getElementById('dataDesejada').value || null;
    const observacoes  = document.getElementById('observacoes').value.trim() || null;
    const msg     = document.getElementById('msgPedido');
    const btn     = document.getElementById('btnEnviar');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');

    msg.style.display = 'none';

    if (!itens.length) {
      msg.textContent = 'Adicione ao menos um produto ao pedido.';
      msg.className = 'msg err'; msg.style.display = 'block';
      return;
    }
    for (const it of itens) {
      if (!it.produto_id || !it.quantidade || parseInt(it.quantidade) < 1) {
        msg.textContent = 'Selecione um produto e informe uma quantidade válida em todos os itens.';
        msg.className = 'msg err'; msg.style.display = 'block';
        return;
      }
    }

    btn.disabled = true; btnText.style.display = 'none'; spinner.style.display = 'block';

    try {
      const r = await fetch('/api/pedidos', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ data_desejada: dataDesejada, observacoes, itens })
      });
      const d = await r.json();
      if (r.ok) {
        msg.textContent = `✅ Pedido ${d.numero} enviado com sucesso!`;
        msg.className = 'msg ok'; msg.style.display = 'block';
        document.getElementById('listaItens').innerHTML = '';
        adicionarItem();
        document.getElementById('dataDesejada').value = '';
        document.getElementById('observacoes').value = '';
        btnText.textContent = 'Enviar Pedido'; btnText.style.display = 'block'; spinner.style.display = 'none';
        btn.disabled = false;
      } else {
        throw new Error(d.erro || 'Erro ao enviar.');
      }
    } catch(e) {
      msg.textContent = e.message; msg.className = 'msg err'; msg.style.display = 'block';
      btn.disabled = false; btnText.style.display = 'block'; spinner.style.display = 'none';
    }
  }

  const STATUS_LABEL = {
    PENDENTE: 'Pendente', CONFIRMADO: 'Confirmado', CANCELADO: 'Cancelado',
  };

  async function carregarHistorico() {
    const el = document.getElementById('listaHistorico');
    try {
      const r = await fetch('/api/pedidos/meus', { credentials:'include' });
      const d = await r.json();
      if (!d.pedidos || !d.pedidos.length) {
        el.innerHTML = '<div class="vazio">Você ainda não fez nenhum pedido.</div>';
        return;
      }
      el.innerHTML = d.pedidos.map(p => renderPedido(p)).join('');
    } catch {
      el.innerHTML = '<div class="vazio">Erro ao carregar histórico.</div>';
    }
  }

  function renderPedido(p) {
    const data = new Date(p.criado_em).toLocaleDateString('pt-BR');
    const desejada = p.data_desejada ? new Date(p.data_desejada + 'T00:00').toLocaleDateString('pt-BR') : null;
    const resumo = p.itens.map(it => `${it.quantidade}x ${it.produto}`).join(', ');
    const itensHtml = p.itens.map(it => `
      <div class="item-linha">
        <span class="item-nome">${it.produto}</span>
        <span class="item-qtd">${it.quantidade}${it.unidade ? ' ' + it.unidade : ''}</span>
      </div>`).join('');
    return `
      <div class="pedido-card">
        <div class="pedido-head" onclick="this.nextElementSibling.classList.toggle('aberto')">
          <div>
            <div class="pedido-num">${p.numero}</div>
            <div class="pedido-data">Feito em ${data}${desejada ? ' · entrega desejada ' + desejada : ''}</div>
            <div class="pedido-resumo">${resumo}</div>
          </div>
          <span class="status-pill st-${p.status}">${STATUS_LABEL[p.status] || p.status}</span>
        </div>
        <div class="pedido-detalhe">
          ${itensHtml}
          ${p.observacoes ? `<div class="pedido-obs">"${p.observacoes}"</div>` : ''}
        </div>
      </div>`;
  }

  async function sair() {
    await fetch('/api/clientes/logout', { method:'POST', credentials:'include' });
    window.location.href = '/';
  }

  // ── Notificações do cliente ──────────────────────────────
  let _notifAbertas = false;

  function toggleNotif(e) {
    e.stopPropagation();
    const p = document.getElementById('notifPainel');
    _notifAbertas = !_notifAbertas;
    p.style.display = _notifAbertas ? 'block' : 'none';
    if (_notifAbertas) carregarNotifCliente();
  }
  document.addEventListener('click', () => {
    if (_notifAbertas) {
      document.getElementById('notifPainel').style.display = 'none';
      _notifAbertas = false;
    }
  });
  document.getElementById('notifPainel')?.addEventListener('click', e => e.stopPropagation());

  async function carregarNotifCliente() {
    try {
      const r = await fetch('/api/notificacoes/cliente', { credentials:'include' });
      const d = await r.json();
      renderNotif(d.notificacoes || []);
    } catch {}
  }

  function renderNotif(lista) {
    const el = document.getElementById('notifLista');
    if (!lista.length) { el.innerHTML = '<div class="notif-vazia">Sem notificações 🎉</div>'; return; }
    el.innerHTML = lista.map(n => {
      const lida = n.lida;
      const diff = Date.now() - new Date(n.criado_em).getTime();
      const min  = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
      const tempo = min<1?'agora':min<60?`há ${min} min`:h<24?`há ${h}h`:`há ${d}d`;
      return `<div class="notif-item ${lida?'':'nao-lida'}">
        <div class="notif-dot ${lida?'lida':''}"></div>
        <div style="flex:1;">
          <div class="notif-titulo">${n.titulo}</div>
          ${n.mensagem?`<div class="notif-msg">${n.mensagem}</div>`:''}
          <div class="notif-tempo">${tempo}</div>
        </div>
      </div>`;
    }).join('');
  }

  async function marcarLidas() {
    try {
      await fetch('/api/notificacoes/cliente/marcar-lidas', { method:'POST', credentials:'include' });
      document.getElementById('sinoBadge').style.display = 'none';
      document.querySelectorAll('.notif-item').forEach(el => {
        el.classList.remove('nao-lida');
        el.querySelector('.notif-dot')?.classList.add('lida');
      });
    } catch {}
  }

  async function atualizarBadgeCliente() {
    try {
      const r = await fetch('/api/notificacoes/cliente/nao-lidas', { credentials:'include' });
      const d = await r.json();
      const badge = document.getElementById('sinoBadge');
      if (d.total > 0) {
        badge.textContent = d.total > 9 ? '9+' : d.total;
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
    } catch {}
  }

  atualizarBadgeCliente();
  setInterval(atualizarBadgeCliente, 30000);
</script>
</body>
</html>
