<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowProd — PMP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/flowprod-app.css">
<style>:root { --accent:#a855f7; --accent2:#6b21a8; }</style>
</head>
<body>
<div id="shell-topbar"></div>

<div class="main">
  <div class="page-head">
    <div class="page-h1">📋 PMP — Plano Mestre de Produção</div>
    <div class="page-sub">O PMP é gerado automaticamente quando um item do PAP é aprovado: a quantidade do mês é dividida em 4 semanas iguais. Redistribua entre as semanas se precisar (o total deve continuar igual ao do PAP) e aprove. Aprovar dispara o MRP.</div>
  </div>

  <div class="toolbar">
    <div class="field"><label>Mês</label><input type="month" id="periodo"></div>
  </div>

  <div id="lista"><div class="vazio">Carregando...</div></div>
</div>

<script src="/js/flowprod-shell.js"></script>
<script>
  const { esc, fmt, api, toast, executar } = FlowShell;
  let periodo = FlowShell.lerPeriodo();
  let dados = [];

  FlowShell.init({ modulo:'PMP', titulo:'PMP — Plano Mestre de Produção', icone:'📋' }).then(() => {
    const inp = document.getElementById('periodo');
    inp.value = periodo;
    inp.onchange = () => { if (!inp.value) return; periodo = inp.value; FlowShell.salvarPeriodo(periodo); carregar(); };
    FlowShell.aoReceberNotificacao = () => { if (!FlowShell.digitando()) carregar(); };
    carregar();
  });

  async function carregar() {
    try {
      const d = await api('/api/pmp?periodo=' + periodo);
      dados = d.pmp || [];
      render();
    } catch (e) { document.getElementById('lista').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
  }

  const dia = (iso) => iso.slice(8, 10);

  function render() {
    const el = document.getElementById('lista');
    if (!dados.length) {
      el.innerHTML = `<div class="card"><div class="vazio">Nenhum PMP para ${esc(FlowShell.rotuloMes(periodo))}.<br>Ele é gerado quando um item do PAP é aprovado.</div></div>`;
      return;
    }
    el.innerHTML = dados.map(card).join('');
    dados.forEach(p => atualizarSoma(p.pap_id));
  }

  function card(p) {
    const rasc = p.status === 'RASCUNHO';
    const semanas = p.semanas.map(s => `
      <div class="semana">
        <label>Semana ${s.semana} · ${dia(s.inicio)}–${dia(s.fim)}</label>
        ${rasc
          ? `<input class="inp num" type="number" min="0" step="1" value="${s.quantidade}" data-pap="${p.pap_id}" oninput="atualizarSoma(${p.pap_id})">`
          : `<b>${fmt(s.quantidade)}</b>`}
      </div>`).join('');
    const acoes = rasc
      ? `<button class="btn sm" onclick="igualar(${p.pap_id})">Distribuir igualmente</button>
         <button class="btn sm primary" onclick="aprovar(${p.pap_id}, this)">Aprovar PMP</button>`
      : `<button class="btn sm" onclick="reabrir(${p.pap_id}, this)">Reabrir</button>`;
    return `<div class="card" id="pap-${p.pap_id}" data-total="${p.quantidade_planejada}">
      <div class="card-head">
        <span><b>${esc(p.produto)}</b> <span class="muted2">· total do PAP: ${fmt(p.quantidade_planejada)} ${esc(p.unidade_padrao)}</span></span>
        <span style="display:flex;gap:8px;align-items:center"><span class="pill st-${p.status}">${rasc ? 'Rascunho' : 'Aprovado'}</span>${acoes}</span>
      </div>
      <div class="card-body">
        <div class="semanas">${semanas}</div>
        ${rasc ? `<div class="soma" id="soma-${p.pap_id}"></div>` : ''}
      </div></div>`;
  }

  function valores(papId) {
    return [...document.querySelectorAll(`input[data-pap="${papId}"]`)].map(i => Number(i.value || 0));
  }
  function atualizarSoma(papId) {
    const el = document.getElementById('soma-' + papId);
    if (!el) return;
    const total = Number(document.getElementById('pap-' + papId).dataset.total);
    const soma = Math.round(valores(papId).reduce((a, b) => a + b, 0) * 100) / 100;
    const ok = Math.abs(soma - total) < 0.005;
    el.className = 'soma ' + (ok ? 'ok' : 'erro-soma');
    el.textContent = ok ? `Soma das semanas: ${fmt(soma)} — confere com o PAP`
      : `Soma das semanas: ${fmt(soma)} — ${soma > total ? 'excede' : 'faltam'} ${fmt(Math.abs(total - soma))} para fechar ${fmt(total)}`;
  }
  function igualar(papId) {
    const total = Number(document.getElementById('pap-' + papId).dataset.total);
    const cent = Math.round(total * 100), base = Math.floor(cent / 4), resto = cent - base * 4;
    document.querySelectorAll(`input[data-pap="${papId}"]`).forEach((inp, i) => { inp.value = (base + (i < resto ? 1 : 0)) / 100; });
    atualizarSoma(papId);
  }

  async function salvar(papId) {
    await api('/api/pmp/pap/' + papId, { metodo:'PUT', corpo:{ semanas: valores(papId) } });
  }
  function aprovar(papId, btn) {
    executar(btn, async () => { await salvar(papId); return api(`/api/pmp/pap/${papId}/aprovar`, { metodo:'POST' }); },
      d => `PMP aprovado. MRP recalculado (${d.mrp.criadas} sugestão(ões) nova(s)).`, carregar);
  }
  function reabrir(papId, btn) { executar(btn, () => api(`/api/pmp/pap/${papId}/reabrir`, { metodo:'POST' }), 'PMP reaberto. MRP recalculado.', carregar); }
</script>
</body>
</html>
