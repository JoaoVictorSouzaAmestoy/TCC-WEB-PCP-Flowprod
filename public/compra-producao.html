<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowProd — Compra/Produção</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/flowprod-app.css">
<style>:root { --accent:#06b6d4; --accent2:#0e7490; }</style>
</head>
<body>
<div id="shell-topbar"></div>

<div class="main">
  <div class="page-head">
    <div class="page-h1">🏭 Compra / Produção</div>
    <div class="page-sub">Ordens sugeridas automaticamente pelo MRP. Você aprova (podendo ajustar a quantidade), acompanha a execução e conclui. Ao concluir, o saldo do produto recebe a entrada no estoque.</div>
  </div>

  <div class="toolbar">
    <div class="field"><label>Mês</label><input type="month" id="periodo"></div>
    <div class="field"><label>Tipo</label>
      <select id="fTipo" onchange="carregar()"><option value="">Todos</option><option value="COMPRA">Compra</option><option value="PRODUCAO">Produção</option></select>
    </div>
    <div class="filtros" id="filtros">
      <button class="filtro-btn active" data-s="" onclick="filtrar('', this)">Todas</button>
      <button class="filtro-btn" data-s="SUGERIDA" onclick="filtrar('SUGERIDA', this)">Sugeridas</button>
      <button class="filtro-btn" data-s="APROVADA" onclick="filtrar('APROVADA', this)">Aprovadas</button>
      <button class="filtro-btn" data-s="EM_ANDAMENTO" onclick="filtrar('EM_ANDAMENTO', this)">Em andamento</button>
      <button class="filtro-btn" data-s="CONCLUIDA" onclick="filtrar('CONCLUIDA', this)">Concluídas</button>
      <button class="filtro-btn" data-s="CANCELADA" onclick="filtrar('CANCELADA', this)">Canceladas</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="card"><div class="tbl-wrap" id="tabela"><div class="vazio">Carregando...</div></div></div>
</div>

<script src="/js/flowprod-shell.js"></script>
<script>
  const { esc, fmt, api, toast, executar } = FlowShell;
  const ST = { SUGERIDA:'Sugerida', APROVADA:'Aprovada', EM_ANDAMENTO:'Em andamento', CONCLUIDA:'Concluída', CANCELADA:'Cancelada' };
  let periodo = FlowShell.lerPeriodo();
  let statusFiltro = '';
  let dados = [];

  FlowShell.init({ modulo:'COMPRA_PRODUCAO', titulo:'Compra/Produção', icone:'🏭' }).then(() => {
    const inp = document.getElementById('periodo');
    inp.value = periodo;
    inp.onchange = () => { if (!inp.value) return; periodo = inp.value; FlowShell.salvarPeriodo(periodo); carregar(); };
    FlowShell.aoReceberNotificacao = () => { if (!FlowShell.digitando()) carregar(); };
    carregar();
  });

  function filtrar(s, btn) {
    statusFiltro = s;
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    carregar();
  }

  async function carregar() {
    try {
      const q = new URLSearchParams({ periodo });
      const tipo = document.getElementById('fTipo').value;
      if (tipo) q.set('tipo', tipo);
      if (statusFiltro) q.set('status', statusFiltro);
      const d = await api('/api/compra-producao?' + q);
      dados = d.ordens || [];
      render();
    } catch (e) { document.getElementById('tabela').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
  }

  function render() {
    const cont = (s) => dados.filter(o => o.status === s).length;
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><b>${cont('SUGERIDA')}</b><span>Sugeridas</span></div>
      <div class="kpi"><b>${cont('APROVADA') + cont('EM_ANDAMENTO')}</b><span>Em execução</span></div>
      <div class="kpi"><b>${cont('CONCLUIDA')}</b><span>Concluídas</span></div>`;
    const el = document.getElementById('tabela');
    if (!dados.length) {
      el.innerHTML = `<div class="vazio">Nenhuma ordem em ${esc(FlowShell.rotuloMes(periodo))} com esses filtros.<br>As sugestões aparecem quando um PMP é aprovado.</div>`;
      return;
    }
    el.innerHTML = `<table class="tbl">
      <thead><tr><th>Tipo</th><th>Produto</th><th class="r">Quantidade</th><th>Status</th><th></th></tr></thead>
      <tbody>${dados.map(linha).join('')}</tbody></table>`;
  }

  function linha(o) {
    const sug = o.status === 'SUGERIDA';
    const qtd = sug
      ? `<input class="inp num" type="number" min="0" step="any" value="${o.quantidade}" id="q-${o.id}" title="Pode ajustar antes de aprovar">`
      : fmt(o.quantidade);
    let acoes = '';
    if (sug) acoes = `<button class="btn sm primary" onclick="aprovar(${o.id}, this)">Aprovar</button>
                      <button class="btn sm danger" onclick="mudar(${o.id}, 'CANCELADA', this, 'Recusar esta sugestão?')">Recusar</button>`;
    else if (o.status === 'APROVADA') acoes = `<button class="btn sm primary" onclick="mudar(${o.id}, 'EM_ANDAMENTO', this)">Iniciar</button>
                      <button class="btn sm danger" onclick="mudar(${o.id}, 'CANCELADA', this, 'Cancelar esta ordem?')">Cancelar</button>`;
    else if (o.status === 'EM_ANDAMENTO') acoes = `<button class="btn sm primary" onclick="mudar(${o.id}, 'CONCLUIDA', this, 'Concluir registra a entrada de ${fmt(o.quantidade)} ${esc(o.unidade_padrao)} de ${esc(o.produto)} no estoque. Continuar?')">Concluir</button>
                      <button class="btn sm danger" onclick="mudar(${o.id}, 'CANCELADA', this, 'Cancelar esta ordem?')">Cancelar</button>`;
    return `<tr>
      <td><span class="pill tipo-${o.tipo}">${o.tipo === 'COMPRA' ? 'Compra' : 'Produção'}</span></td>
      <td><b>${esc(o.produto)}</b><span class="sub">${esc(o.unidade_padrao)}</span></td>
      <td class="r">${qtd}</td>
      <td><span class="pill st-${o.status}">${ST[o.status]}</span></td>
      <td><div class="acoes">${acoes}</div></td></tr>`;
  }

  function aprovar(id, btn) {
    const v = Number(document.getElementById('q-' + id).value);
    if (!(v > 0)) { toast('Informe uma quantidade maior que zero.', 'erro'); return; }
    executar(btn, () => api(`/api/compra-producao/${id}/status`, { metodo:'PATCH', corpo:{ status:'APROVADA', quantidade: v } }), 'Ordem aprovada.', carregar);
  }
  function mudar(id, status, btn, confirmacao) {
    if (confirmacao && !confirm(confirmacao)) return;
    executar(btn, () => api(`/api/compra-producao/${id}/status`, { metodo:'PATCH', corpo:{ status } }),
      status === 'CONCLUIDA' ? 'Ordem concluída. Estoque atualizado.' : 'Ordem atualizada.', carregar);
  }
</script>
</body>
</html>
