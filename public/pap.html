<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowProd — PAP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/flowprod-app.css">
<style>:root { --accent:#f43f5e; --accent2:#be123c; }</style>
</head>
<body>
<div id="shell-topbar"></div>

<div class="main">
  <div class="page-head">
    <div class="page-h1">📐 PAP — Plano Agregado de Produção</div>
    <div class="page-sub">Monte o plano do mês a partir dos forecasts aprovados. A produção sugerida é o forecast menos o estoque atual do produto acabado; você ajusta e aprova. Ao aprovar, o PMP semanal é gerado automaticamente.</div>
  </div>

  <div class="toolbar">
    <div class="field"><label>Mês</label><input type="month" id="periodo"></div>
    <button class="btn primary" id="btnMontar" onclick="montar(this)">Montar PAP</button>
    <span class="muted2" id="avisoMontar"></span>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="card"><div class="tbl-wrap" id="tabela"><div class="vazio">Carregando...</div></div></div>
</div>

<script src="/js/flowprod-shell.js"></script>
<script>
  const { esc, fmt, api, toast, executar } = FlowShell;
  let periodo = FlowShell.lerPeriodo();
  let dados = [], disponiveis = 0;

  FlowShell.init({ modulo:'PAP', titulo:'PAP — Plano Agregado de Produção', icone:'📐' }).then(() => {
    const inp = document.getElementById('periodo');
    inp.value = periodo;
    inp.onchange = () => { if (!inp.value) return; periodo = inp.value; FlowShell.salvarPeriodo(periodo); carregar(); };
    FlowShell.aoReceberNotificacao = () => { if (!FlowShell.digitando()) carregar(); };
    carregar();
  });

  async function carregar() {
    try {
      const d = await api('/api/pap?periodo=' + periodo);
      dados = d.pap || []; disponiveis = d.forecasts_disponiveis || 0;
      render();
    } catch (e) { document.getElementById('tabela').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
  }

  function render() {
    document.getElementById('btnMontar').disabled = disponiveis === 0;
    document.getElementById('avisoMontar').textContent = disponiveis
      ? `${disponiveis} forecast(s) aprovado(s) aguardando inclusão`
      : 'Nenhum forecast aprovado novo neste mês';
    const aprov = dados.filter(p => p.status === 'APROVADO').length;
    const total = dados.reduce((a, p) => a + p.quantidade_planejada, 0);
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><b>${dados.length}</b><span>Itens no plano</span></div>
      <div class="kpi"><b>${dados.length - aprov}</b><span>Rascunho</span></div>
      <div class="kpi"><b>${aprov}</b><span>Aprovados</span></div>
      <div class="kpi"><b>${fmt(total, 0)}</b><span>Unidades a produzir</span></div>`;

    const el = document.getElementById('tabela');
    if (!dados.length) {
      el.innerHTML = `<div class="vazio">Nenhum item no PAP de ${esc(FlowShell.rotuloMes(periodo))}.<br>Aprove os forecasts do mês e clique em <b>Montar PAP</b>.</div>`;
      return;
    }
    el.innerHTML = `<table class="tbl">
      <thead><tr><th>Produto</th><th class="r">Forecast</th><th class="r">Estoque (na montagem)</th><th class="r">Demanda confirmada</th><th class="r">Produção planejada</th><th>Status</th><th></th></tr></thead>
      <tbody>${dados.map(linha).join('')}</tbody></table>`;
  }

  function linha(p) {
    const rasc = p.status === 'RASCUNHO';
    const mudou = Math.abs(p.estoque_agora - p.estoque_atual) > 0.005;
    const plan = rasc
      ? `<input class="inp num" type="number" min="0" step="1" value="${p.quantidade_planejada}" onchange="salvar(${p.id}, this)" title="Ajuste e saia do campo para salvar">`
      : fmt(p.quantidade_planejada);
    const acoes = rasc
      ? `<button class="btn sm primary" onclick="aprovar(${p.id}, this)">Aprovar e gerar PMP</button>
         <button class="btn sm danger" onclick="remover(${p.id}, this)">Remover</button>`
      : `<button class="btn sm" ${p.pmp_aprovado ? 'disabled title="PMP já aprovado — reabra o PMP antes"' : ''} onclick="reabrir(${p.id}, this)">Reabrir</button>`;
    return `<tr>
      <td><b>${esc(p.produto)}</b><span class="sub">${esc(p.unidade_padrao)}</span></td>
      <td class="r">${fmt(p.quantidade_forecast)}</td>
      <td class="r">${fmt(p.estoque_atual)}${rasc && mudou ? `<span class="sub">hoje: ${fmt(p.estoque_agora)}</span>` : ''}</td>
      <td class="r muted">${fmt(p.demanda_confirmada)}</td>
      <td class="r">${plan}</td>
      <td><span class="pill st-${p.status}">${rasc ? 'Rascunho' : 'Aprovado'}</span></td>
      <td><div class="acoes">${acoes}</div></td></tr>`;
  }

  function montar(btn) {
    executar(btn, () => api('/api/pap/montar', { metodo:'POST', corpo:{ periodo } }), d => d.mensagem, carregar);
  }
  function salvar(id, input) {
    const v = input.value === '' ? null : Number(input.value);
    if (v === null || !(v >= 0)) { toast('Informe uma quantidade válida.', 'erro'); carregar(); return; }
    executar(null, () => api('/api/pap/' + id, { metodo:'PATCH', corpo:{ quantidade_planejada: v } }), 'Quantidade salva.', carregar);
  }
  function aprovar(id, btn) { executar(btn, () => api(`/api/pap/${id}/aprovar`, { metodo:'POST' }), 'PAP aprovado. PMP gerado — siga para o módulo PMP.', carregar); }
  function reabrir(id, btn) { executar(btn, () => api(`/api/pap/${id}/reabrir`, { metodo:'POST' }), 'PAP reaberto.', carregar); }
  function remover(id, btn) { if (confirm('Remover este item do PAP? O forecast volta a ficar disponível.')) executar(btn, () => api('/api/pap/' + id, { metodo:'DELETE' }), 'Item removido.', carregar); }
</script>
</body>
</html>
