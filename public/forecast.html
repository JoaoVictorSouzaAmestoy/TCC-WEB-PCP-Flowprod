<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowProd — Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/flowprod-app.css">
<style>:root { --accent:#2b7fff; --accent2:#1a5ccc; }</style>
</head>
<body>
<div id="shell-topbar"></div>

<div class="main">
  <div class="page-head">
    <div class="page-h1">📊 Forecast</div>
    <div class="page-sub">Previsão de demanda por produto e mês. O sistema sugere a quantidade pela média móvel dos 3 meses anteriores de demanda confirmada; você ajusta se necessário e aprova. Forecast aprovado segue para o PAP.</div>
  </div>

  <div class="toolbar">
    <div class="field"><label>Mês</label><input type="month" id="periodo"></div>
    <button class="btn primary" id="btnCalcular" onclick="calcular(this)">Calcular sugestão</button>
    <button class="btn" onclick="toggleManual()">+ Lançar manualmente</button>
  </div>

  <div class="card" id="cardManual" style="display:none">
    <div class="card-head">Lançamento manual (ex.: produto novo, sem histórico de demanda)</div>
    <div class="form-inline">
      <div class="field"><label>Produto</label><select id="mProduto" style="min-width:220px"></select></div>
      <div class="field"><label>Quantidade prevista</label><input type="number" id="mQtd" min="0" step="1" placeholder="vazio = sugestão"></div>
      <div class="field" style="flex:1;min-width:200px"><label>Observações</label><input type="text" id="mObs" maxlength="200"></div>
      <button class="btn primary" onclick="lancarManual(this)">Lançar</button>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="card"><div class="tbl-wrap" id="tabela"><div class="vazio">Carregando...</div></div></div>
</div>

<script src="/js/flowprod-shell.js"></script>
<script>
  const { esc, fmt, api, toast, executar } = FlowShell;
  const STATUS = { PENDENTE:'Pendente', APROVADO:'Aprovado', REVISAO:'Em revisão' };
  let periodo = FlowShell.lerPeriodo();
  let dados = [];

  FlowShell.init({ modulo:'FORECAST', titulo:'Forecast — Previsão de demanda', icone:'📊' }).then(() => {
    const inp = document.getElementById('periodo');
    inp.value = periodo;
    inp.onchange = () => { if (!inp.value) return; periodo = inp.value; FlowShell.salvarPeriodo(periodo); carregar(); };
    FlowShell.aoReceberNotificacao = () => { if (!FlowShell.digitando()) carregar(); };
    carregarProdutos();
    carregar();
  });

  async function carregarProdutos() {
    try {
      const d = await api('/api/produtos');
      const acabados = (d.produtos || []).filter(p => p.tipo === 'ACABADO' && p.ativo);
      document.getElementById('mProduto').innerHTML = acabados.length
        ? acabados.map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')
        : '<option value="">Nenhum produto acabado ativo</option>';
    } catch {}
  }

  async function carregar() {
    try {
      const d = await api('/api/forecast?periodo=' + periodo);
      dados = d.forecast || [];
      render();
    } catch (e) {
      document.getElementById('tabela').innerHTML = `<div class="vazio">${esc(e.message)}</div>`;
    }
  }

  function render() {
    const cont = (s) => dados.filter(f => f.status === s).length;
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><b>${dados.length}</b><span>Produtos</span></div>
      <div class="kpi"><b>${cont('PENDENTE')}</b><span>Pendentes</span></div>
      <div class="kpi"><b>${cont('REVISAO')}</b><span>Em revisão</span></div>
      <div class="kpi"><b>${cont('APROVADO')}</b><span>Aprovados</span></div>`;

    const el = document.getElementById('tabela');
    if (!dados.length) {
      el.innerHTML = `<div class="vazio">Nenhum forecast para ${esc(FlowShell.rotuloMes(periodo))}.<br>Use <b>Calcular sugestão</b> para gerar a partir da demanda histórica, ou lance manualmente.</div>`;
      return;
    }
    el.innerHTML = `<table class="tbl">
      <thead><tr><th>Produto</th><th class="r">Demanda confirmada no mês</th><th class="r">Sugestão (média 3 meses)</th><th class="r">Previsto</th><th>Status</th><th></th></tr></thead>
      <tbody>${dados.map(linha).join('')}</tbody></table>`;
  }

  function linha(f) {
    const aprovado = f.status === 'APROVADO';
    const prev = aprovado
      ? fmt(f.quantidade_prevista)
      : `<input class="inp num" type="number" min="0" step="1" value="${f.quantidade_prevista}" onchange="salvarQtd(${f.id}, this)" title="Ajuste e saia do campo para salvar">`;
    let acoes;
    if (aprovado) {
      acoes = `<button class="btn sm" ${f.tem_pap ? 'disabled title="Já usado em um PAP"' : ''} onclick="status(${f.id}, 'REVISAO', this)">Voltar p/ revisão</button>`;
    } else {
      acoes = `<button class="btn sm primary" onclick="status(${f.id}, 'APROVADO', this)">Aprovar</button>
        ${f.status === 'PENDENTE' ? `<button class="btn sm" onclick="status(${f.id}, 'REVISAO', this)">Revisão</button>` : ''}
        <button class="btn sm danger" onclick="remover(${f.id}, this)">Remover</button>`;
    }
    return `<tr>
      <td><b>${esc(f.produto)}</b><span class="sub">${esc(f.unidade_padrao)}${f.observacoes ? ' · ' + esc(f.observacoes) : ''}</span></td>
      <td class="r muted">${fmt(f.demanda_confirmada)}</td>
      <td class="r muted">${fmt(f.quantidade_sugerida)}</td>
      <td class="r">${prev}</td>
      <td><span class="pill st-${f.status}">${STATUS[f.status] || f.status}</span></td>
      <td><div class="acoes">${acoes}</div></td></tr>`;
  }

  function calcular(btn) {
    executar(btn, () => api('/api/forecast/calcular', { metodo:'POST', corpo:{ periodo } }),
      d => `${d.criados} criado(s), ${d.atualizados} atualizado(s)` +
           (d.aprovados_mantidos ? `, ${d.aprovados_mantidos} aprovado(s) mantido(s)` : '') +
           (d.sem_historico ? `. ${d.sem_historico} produto(s) sem histórico (lance manualmente).` : '.'),
      async () => { await carregar(); btn.disabled = false; });
  }

  function salvarQtd(id, input) {
    const v = input.value === '' ? null : Number(input.value);
    if (v === null || !(v >= 0)) { toast('Informe uma quantidade válida.', 'erro'); carregar(); return; }
    executar(null, () => api('/api/forecast/' + id, { metodo:'PATCH', corpo:{ quantidade_prevista: v } }), 'Quantidade salva.', carregar);
  }
  function status(id, st, btn) { executar(btn, () => api(`/api/forecast/${id}/status`, { metodo:'PATCH', corpo:{ status: st } }), st === 'APROVADO' ? 'Forecast aprovado.' : 'Status atualizado.', carregar); }
  function remover(id, btn) { if (confirm('Remover este forecast?')) executar(btn, () => api('/api/forecast/' + id, { metodo:'DELETE' }), 'Removido.', carregar); }

  function toggleManual() { const c = document.getElementById('cardManual'); c.style.display = c.style.display === 'none' ? 'block' : 'none'; }
  function lancarManual(btn) {
    const produto_id = document.getElementById('mProduto').value;
    if (!produto_id) { toast('Selecione um produto.', 'erro'); return; }
    const q = document.getElementById('mQtd').value;
    const corpo = { produto_id, periodo, observacoes: document.getElementById('mObs').value.trim() || undefined };
    if (q !== '') corpo.quantidade_prevista = Number(q);
    executar(btn, () => api('/api/forecast', { metodo:'POST', corpo }), 'Forecast lançado.', async () => {
      document.getElementById('mQtd').value = ''; document.getElementById('mObs').value = '';
      await carregar(); btn.disabled = false;
    });
  }
</script>
</body>
</html>
